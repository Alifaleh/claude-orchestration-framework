#     path: backend                       # directory inside the workspace
#     url: https://github.com/__GITHUB_USER__/{{PROJECT_NAME}}-backend
#     branch: main
#     kind: code                          # code = the team edits it: feature branch + PR
#     submodules: false                   # true = run `git submodule update --init --recursive` after clone/pull
#   - name: odoo-vendor
#     path: vendor/odoo
#     url: https://github.com/odoo/odoo
#     branch: "18.0"
#     kind: vendor                        # vendor = third-party/reference tree — cloned, read, NEVER edited

launch: see ONBOARDING.md
