# Workspace manifest — the map /onboard, the sync command, and orchestrators navigate by.
# Every repo of this project is registered here and gitignored by the workspace repo.
name: {{PROJECT_NAME}}
github_org:                              # repos live under this GitHub org; empty = the user's account
workspace_repo: {{WORKSPACE_REPO_URL}}   # e.g. https://github.com/__GITHUB_USER__/{{PROJECT_NAME}}-workspace

repos: []
# repos:
